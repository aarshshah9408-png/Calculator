<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    
    <!-- iOS PWA Meta Tags to make it look and act like a native app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Calculator">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* Settings overlay / trigger area */
        #settings-trigger {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            z-index: 100;
        }

        /* Settings Modal */
        #settings-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #settings-modal input {
            font-size: 24px;
            padding: 10px;
            width: 80%;
            margin: 15px 0;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            text-align: center;
        }

        #settings-modal button {
            font-size: 18px;
            padding: 10px 20px;
            background: #ff9f0a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        /* Display Screen */
        .display-container {
            padding: 24px;
            text-align: right;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            flex-grow: 1;
        }

        #display {
            font-size: 85px;
            font-weight: 300;
            line-height: 1;
            word-break: break-all;
            word-wrap: break-word;
        }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 12px;
            padding-bottom: 34px; /* Safe area padding for iPhones */
        }

        button.key {
            background-color: #333333;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 34px;
            height: 80px;
            width: 80px;
            justify-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.key:active {
            filter: brightness(1.4);
        }

        /* Specific Button Styles matching iOS */
        .key.light-gray {
            background-color: #a5a5a5;
            color: #000;
        }

        .key.light-gray:active {
            background-color: #d8d8d8;
        }

        .key.orange {
            background-color: #ff9f0a;
            color: #fff;
        }

        .key.orange:active, .key.orange.active-op {
            background-color: #fff;
            color: #ff9f0a;
        }

        .key.zero {
            grid-column: span 2;
            width: 172px;
            border-radius: 40px;
            justify-content: flex-start;
            padding-left: 31px;
        }
    </style>
</head>
<body>

    <!-- Hidden secret settings toggle (Triple tap top-left corner) -->
    <div id="settings-trigger" onclick="handleSecretTap()"></div>

    <!-- Settings Menu -->
    <div id="settings-modal">
        <h2>Magic Settings</h2>
        <p style="color: #888; font-size: 14px; margin-top:5px;">Enter your target force number:</p>
        <input type="number" id="force-input" placeholder="e.g. 1984">
        <button onclick="saveSettings()">Save & Close</button>
    </div>

    <!-- Calculator Display -->
    <div class="display-container">
        <div id="display">0</div>
    </div>

    <!-- Keypad Layout -->
    <div class="keypad">
        <button class="key light-gray" onclick="clearCalculator()" id="clear-btn">AC</button>
        <button class="key light-gray" onclick="toggleSign()">±</button>
        <button class="key light-gray" onclick="percentage()">%</button>
        <button class="key orange" onclick="setOperation('÷')">÷</button>

        <button class="key" onclick="appendNumber('7')">7</button>
        <button class="key" onclick="appendNumber('8')">8</button>
        <button class="key" onclick="appendNumber('9')">9</button>
        <button class="key orange" onclick="setOperation('×')">>×</button>

        <button class="key" onclick="appendNumber('4')">4</button>
        <button class="key" onclick="appendNumber('5')">5</button>
        <button class="key" onclick="appendNumber('6')">6</button>
        <button class="key orange" onclick="setOperation('-')">-</button>

        <button class="key" onclick="appendNumber('1')">1</button>
        <button class="key" onclick="appendNumber('2')">2</button>
        <button class="key" onclick="appendNumber('3')">3</button>
        <button class="key orange" onclick="setOperation('+')">+</button>

        <button class="key zero" onclick="appendNumber('0')">0</button>
        <button class="key" onclick="appendDecimal()">.</button>
        <button class="key orange" onclick="calculate()">=</button>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = null;
        let operation = null;
        let resetScreen = false;

        // Magic state variables
        let forceNumber = localStorage.getItem('magic_force_num') ? parseFloat(localStorage.getItem('magic_force_num')) : null;
        let isFaceDownTriggered = false;
        let secretTapCount = 0;
        let secretTapTimer = null;

        // Settings Handling
        function handleSecretTap() {
            secretTapCount++;
            clearTimeout(secretTapTimer);
            secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1000);
            
            if (secretTapCount >= 3) {
                secretTapCount = 0;
                document.getElementById('force-input').value = forceNumber !== null ? forceNumber : '';
                document.getElementById('settings-modal').style.display = 'flex';
            }
        }

        function saveSettings() {
            const val = document.getElementById('force-input').value;
            if (val !== '') {
                forceNumber = parseFloat(val);
                localStorage.setItem('magic_force_num', forceNumber);
            }
            document.getElementById('settings-modal').style.display = 'none';
        }

        // Standard Calculator Logic
        function updateDisplay() {
            const displayElem = document.getElementById('display');
            // Format string length safely to fit screen
            if (currentInput.length > 9) {
                displayElem.innerText = parseFloat(currentInput).toExponential(5);
            } else {
                displayElem.innerText = currentInput;
            }
            
            // Toggle AC / C display context if needed
            document.getElementById('clear-btn').innerText = (currentInput !== '0' || previousInput !== null) ? 'C' : 'AC';
        }

        function appendNumber(num) {
            if (currentInput === '0' || resetScreen) {
                currentInput = num;
                resetScreen = false;
            } else {
                if (currentInput.length < 9) {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (resetScreen) {
                currentInput = '0.';
                resetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function clearCalculator() {
            currentInput = '0';
            previousInput = null;
            operation = null;
            isFaceDownTriggered = false;
            updateDisplay();
        }

        function toggleSign() {
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function percentage() {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
        }

        function setOperation(op) {
            if (operation !== null) calculate();
            previousInput = parseFloat(currentInput);
            operation = op;
            resetScreen = true;
        }

        function calculate() {
            if (operation === null || previousInput === null) return;
            
            // If the face-down event occurred, inject the covert magic adjustment
            if (isFaceDownTriggered && forceNumber !== null) {
                // Determine what number would make the math equal the forced target output under current context
                let currentVal = parseFloat(currentInput);
                let neededAdditionOrValue;

                // Adjust based on current active operation sequence
                if (operation === '+') {
                    neededAdditionOrValue = forceNumber - previousInput;
                } else if (operation === '×') {
                    neededAdditionOrValue = forceNumber / previousInput;
                } else {
                    neededAdditionOrValue = forceNumber;
                }
                currentInput = neededAdditionOrValue.toString();
                isFaceDownTriggered = false; // reset flag
            }

            let computation;
            const prev = previousInput;
            const current = parseFloat(currentInput);

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    computation = current === 0 ? 'Error' : prev / current;
                    break;
                default:
                    return;
            }

            currentInput = computation.toString();
            operation = null;
            previousInput = null;
            resetScreen = true;
            updateDisplay();
        }

        // Gyroscope / Face-Down Detection for iPhone
        window.addEventListener('deviceorientation', (event) => {
            // event.beta represents front-to-back tilt in degrees (-180 to 180)
            // When an iPhone is laid flat face down on a table, beta is typically around -180 or 180, or gamma shifts significantly.
            // A reliable bounds check for face-down: absolute beta near 180 or close to flat upside down.
            let beta = event.beta;
            let gamma = event.gamma;

            // Simple threshold: if phone is turned face down (screen pointing towards table/ground)
            // On iOS, checking if beta goes near absolute 180 or if alpha/beta/gamma indicates face down position.
            // Alternately, checking device orientation angle via window.screen.orientation or standard flip logic:
            if (beta !== null && (Math.abs(beta) > 150 && Math.abs(beta) <= 180)) {
                if (forceNumber !== null) {
                    isFaceDownTriggered = true;
                }
            }
        });

        // Request permission for orientation sensors on modern iOS devices if required
        document.body.addEventListener('click', function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            // Permission granted
                        }
                    }).catch(console.error);
            }
            // Remove listener after first click to avoid repeat popups
            document.body.removeEventListener('click', initSensors);
        }, { once: true });
    </script>
</body>
</html>
